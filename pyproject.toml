[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itom-alert-service-impact"
version = "1.0.0"
description = "Event-to-CI binding and service impact ranking modeled on ServiceNow Event Management"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pooja Jakka"}]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[tool.setuptools]
packages = ["impact"]

[tool.ruff]
line-length = 120
